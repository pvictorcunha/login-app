<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oreia app — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="brand">
        <div class="brand-logo">O</div>
        <div class="brand-name">Oreia app</div>
      </div>
      <div class="brand-tagline">Painel do usuário</div>

      <h1>Dashboard</h1>
      <p class="subtitle">Você está autenticado!</p>

      <div id="userInfo" class="user-info">Carregando...</div>

      <div class="nav-links">
        <a href="/profile">Meu perfil</a>
      </div>

      <button id="logoutBtn">Sair</button>
    </div>
  </div>
  <script>
    (async () => {
      const res = await fetch('/api/me');
      if (!res.ok) { window.location.href = '/'; return; }
      const data = await res.json();
      const u = data.user;
      document.getElementById('userInfo').innerHTML =
        `<p><strong>Usuário:</strong> ${u.username}</p>
         <p><strong>E-mail:</strong> ${u.email}</p>
         <p><strong>Nome:</strong> ${u.fullName || '-'}</p>`;
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });
  </script>
</body>
</html>
