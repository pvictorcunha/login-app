<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Bem-vindo</h1>
      <p class="subtitle">Faça login para continuar</p>

      <div id="message" class="message" hidden></div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Usuário ou e-mail</label>
          <input type="text" id="username" name="username" placeholder="admin" required />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" id="submitBtn">Entrar</button>
      </form>

      <p class="hint">Não tem conta? <a href="#" id="showRegister">Criar conta</a></p>

      <form id="registerForm" hidden>
        <div class="field">
          <label for="regUsername">Usuário</label>
          <input type="text" id="regUsername" name="username" required />
        </div>
        <div class="field">
          <label for="regEmail">E-mail</label>
          <input type="email" id="regEmail" name="email" required />
        </div>
        <div class="field">
          <label for="regPassword">Senha</label>
          <input type="password" id="regPassword" name="password" minlength="6" required />
        </div>
        <button type="submit">Criar conta</button>
        <p class="hint"><a href="#" id="showLogin">Voltar ao login</a></p>
      </form>

      <p class="credentials">Credenciais padrão: <strong>admin</strong> / <strong>admin123</strong></p>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
